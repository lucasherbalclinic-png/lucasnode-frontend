<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="LucasNode — Jenga, jaribu, host na deploy miradi yako ya kidijitali kwenye jukwaa moja.">
<title>LucasNode — Cloud Platform</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
:root {
  --navy:#0b1739;
  --navy2:#142751;
  --green:#10b981;
  --green2:#059669;
  --blue:#3b82f6;
  --gold:#fbbf24;
  --bg:#f5f7fb;
  --white:#ffffff;
  --text:#15213b;
  --muted:#75819a;
  --border:#e6eaf2;
  --shadow:0 15px 45px rgba(15,35,75,.09);
  --radius:18px;
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html {
  scroll-behavior:smooth;
  scroll-padding-top:90px;
}

body {
  font-family:'Inter',sans-serif;
  color:var(--text);
  background:#fff;
  line-height:1.65;
  overflow-x:hidden;
}

button,input,textarea,select {
  font:inherit;
}

button,a {
  -webkit-tap-highlight-color:transparent;
}

button {
  cursor:pointer;
}

a {
  color:inherit;
  text-decoration:none;
}

.container {
  width:min(1160px,92%);
  margin:auto;
}

section {
  padding:90px 0;
}

.section-heading {
  max-width:720px;
  margin:0 auto 45px;
  text-align:center;
}

.section-heading .eyebrow {
  margin-bottom:12px;
}

.eyebrow {
  display:inline-flex;
  align-items:center;
  gap:8px;
  color:var(--green2);
  background:#eafbf4;
  border:1px solid #d2f6e5;
  padding:7px 13px;
  border-radius:30px;
  font-size:12px;
  font-weight:800;
  letter-spacing:.5px;
  text-transform:uppercase;
}

.section-heading h2 {
  font-size:clamp(28px,4vw,43px);
  line-height:1.2;
  letter-spacing:-1.4px;
  color:var(--navy);
  margin:15px 0;
}

.section-heading p {
  color:var(--muted);
  font-size:15px;
}

.btn {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:13px 20px;
  border-radius:12px;
  border:1px solid transparent;
  font-weight:750;
  font-size:14px;
  transition:.25s;
  cursor:pointer;
}

.btn:hover {
  transform:translateY(-2px);
}

.btn-primary {
  color:#fff;
  background:linear-gradient(135deg,var(--green),var(--green2));
  box-shadow:0 8px 22px rgba(16,185,129,.2);
}

.btn-primary:hover {
  box-shadow:0 12px 28px rgba(16,185,129,.3);
}

.btn-outline {
  color:var(--navy);
  border-color:var(--border);
  background:#fff;
}

.btn-outline:hover {
  border-color:var(--green);
  color:var(--green2);
}

.btn-dark {
  color:#fff;
  background:var(--navy);
}

.btn-small {
  padding:9px 13px;
  font-size:12px;
  border-radius:9px;
}

.muted {
  color:var(--muted);
}

.topbar {
  background:var(--navy);
  color:#fff;
  text-align:center;
  padding:8px 12px;
  font-size:12px;
}

.topbar strong {
  color:#6ee7b7;
}

.navbar {
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(15px);
  border-bottom:1px solid rgba(230,234,242,.9);
}

.nav-inner {
  min-height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:25px;
}

.brand {
  display:inline-flex;
  align-items:center;
  gap:11px;
  flex-shrink:0;
}

.brand-icon {
  display:grid;
  place-items:center;
  width:43px;
  height:43px;
  color:#fff;
  border-radius:13px;
  font-size:23px;
  font-weight:900;
  background:linear-gradient(135deg,#34d399,#059669);
  box-shadow:0 7px 18px rgba(16,185,129,.25);
}

.brand-name {
  color:var(--navy);
  font-size:23px;
  font-weight:900;
  letter-spacing:-1px;
}

.brand-name span {
  color:var(--green2);
}

.nav-links {
  display:flex;
  align-items:center;
  gap:23px;
}

.nav-links a {
  font-size:13px;
  font-weight:650;
  color:#5c6881;
  transition:.2s;
}

.nav-links a:hover {
  color:var(--green2);
}

.nav-actions {
  display:flex;
  align-items:center;
  gap:9px;
}

.menu-toggle {
  display:none;
  width:43px;
  height:43px;
  border:1px solid var(--border);
  background:#fff;
  color:var(--navy);
  border-radius:11px;
  font-size:20px;
}

.hero {
  padding:75px 0 80px;
  background:
    radial-gradient(circle at 85% 20%,rgba(16,185,129,.11),transparent 28%),
    radial-gradient(circle at 5% 75%,rgba(59,130,246,.07),transparent 28%),
    linear-gradient(180deg,#fff,#fbfcff);
}

.hero-grid {
  display:grid;
  grid-template-columns:1.03fr .97fr;
  align-items:center;
  gap:55px;
}

.hero h1 {
  margin:22px 0 20px;
  max-width:650px;
  font-size:clamp(36px,5.3vw,62px);
  line-height:1.09;
  letter-spacing:-2.5px;
  color:var(--navy);
}

.hero h1 span {
  color:var(--green2);
}

.hero-copy {
  max-width:590px;
  color:var(--muted);
  font-size:16px;
  line-height:1.85;
}

.hero-buttons {
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:28px;
}

.hero-points {
  display:flex;
  flex-wrap:wrap;
  gap:13px 20px;
  margin-top:25px;
}

.hero-points span {
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  color:#56637a;
  font-weight:650;
}

.hero-points i {
  color:var(--green2);
}

.dashboard-shell {
  position:relative;
  padding:15px;
  border:1px solid #e8edf5;
  background:rgba(255,255,255,.92);
  border-radius:25px;
  box-shadow:0 28px 75px rgba(15,35,75,.13);
}

.dashboard-window {
  border:1px solid var(--border);
  border-radius:17px;
  overflow:hidden;
  background:#fff;
}

.window-bar {
  padding:13px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#fbfcfe;
  border-bottom:1px solid var(--border);
}

.window-dots {
  display:flex;
  gap:5px;
}

.window-dots span {
  width:8px;
  height:8px;
  border-radius:50%;
  background:#d1d9e6;
}

.window-dots span:first-child {
  background:#fb7185;
}

.window-dots span:nth-child(2) {
  background:#fbbf24;
}

.window-dots span:nth-child(3) {
  background:#34d399;
}

.window-label {
  color:var(--muted);
  font-size:11px;
  font-weight:700;
}

.preview-content {
  padding:20px;
}

.preview-welcome {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:17px;
}

.preview-welcome h3 {
  font-size:17px;
  color:var(--navy);
}

.preview-welcome p {
  color:var(--muted);
  font-size:11px;
}

.live-pill {
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:5px 9px;
  color:#047857;
  background:#e8fbf3;
  border-radius:20px;
  font-size:10px;
  font-weight:800;
}

.live-pill i {
  font-size:7px;
}

.preview-balance {
  padding:22px;
  border-radius:17px;
  color:#fff;
  background:linear-gradient(135deg,#10244c,#087d66);
  position:relative;
  overflow:hidden;
}

.preview-balance:after {
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  border-radius:50%;
  background:rgba(255,255,255,.06);
  right:-50px;
  top:-85px;
}

.balance-top {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  font-size:11px;
  color:#d8f7eb;
}

.balance-value {
  font-size:27px;
  font-weight:850;
  margin:10px 0;
  letter-spacing:-.6px;
}

.balance-foot {
  display:flex;
  gap:8px;
  align-items:center;
  color:#d8f7eb;
  font-size:10px;
}

.preview-stats {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:14px 0;
}

.preview-stat {
  padding:13px 10px;
  border:1px solid var(--border);
  border-radius:13px;
}

.preview-stat i {
  color:var(--green2);
  margin-bottom:9px;
}

.preview-stat strong {
  display:block;
  color:var(--navy);
  font-size:17px;
}

.preview-stat span {
  color:var(--muted);
  font-size:10px;
}

.preview-project-title {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:20px 0 10px;
  color:var(--navy);
  font-weight:800;
  font-size:12px;
}

.preview-project {
  display:flex;
  align-items:center;
  gap:11px;
  padding:12px 0;
  border-top:1px solid #eef1f6;
}

.project-symbol {
  display:grid;
  place-items:center;
  width:36px;
  height:36px;
  border-radius:10px;
  color:#047857;
  background:#e7fbf2;
}

.preview-project:nth-of-type(2) .project-symbol {
  color:#2563eb;
  background:#eaf1ff;
}

.preview-project:nth-of-type(3) .project-symbol {
  color:#b45309;
  background:#fff4dc;
}

.preview-project-info {
  flex:1;
  min-width:0;
}

.preview-project-info strong {
  display:block;
  color:var(--navy);
  font-size:11px;
}

.preview-project-info span {
  display:block;
  color:var(--muted);
  font-size:10px;
}

.floating-note {
  position:absolute;
  right:-20px;
  bottom:55px;
  padding:13px 15px;
  border:1px solid #e7f8ef;
  border-radius:14px;
  background:#fff;
  box-shadow:var(--shadow);
  display:flex;
  align-items:center;
  gap:10px;
  animation:float 4s ease-in-out infinite;
}

.floating-note .note-icon {
  width:36px;
  height:36px;
  display:grid;
  place-items:center;
  border-radius:11px;
  color:var(--green2);
  background:#e8fbf3;
}

.floating-note strong {
  display:block;
  font-size:11px;
  color:var(--navy);
}

.floating-note span {
  display:block;
  font-size:10px;
  color:var(--muted);
}

@keyframes float {
  0%,100% {transform:translateY(0)}
  50% {transform:translateY(-8px)}
}

.trust-strip {
  padding:25px 0;
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
  background:#fff;
}

.trust-inner {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
}

.trust-title {
  color:var(--muted);
  font-size:12px;
  font-weight:700;
}

.trust-item {
  display:flex;
  align-items:center;
  gap:9px;
  color:#485772;
  font-size:13px;
  font-weight:750;
}

.trust-item i {
  color:var(--green2);
  font-size:17px;
}

.features-section {
  background:var(--bg);
}

.features-grid {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.feature-card {
  padding:25px 22px;
  border:1px solid var(--border);
  border-radius:var(--radius);
  background:#fff;
  transition:.25s;
}

.feature-card:hover {
  transform:translateY(-5px);
  box-shadow:var(--shadow);
  border-color:#c9f2df;
}

.feature-icon {
  width:49px;
  height:49px;
  display:grid;
  place-items:center;
  border-radius:14px;
  color:var(--green2);
  background:#e9fbf3;
  font-size:21px;
  margin-bottom:19px;
}

.feature-card:nth-child(2) .feature-icon {
  color:#2563eb;
  background:#eaf1ff;
}

.feature-card:nth-child(3) .feature-icon {
  color:#7c3aed;
  background:#f1eaff;
}

.feature-card:nth-child(4) .feature-icon {
  color:#b45309;
  background:#fff4dc;
}

.feature-card h3 {
  color:var(--navy);
  font-size:16px;
  margin-bottom:10px;
}

.feature-card p {
  color:var(--muted);
  font-size:13px;
  line-height:1.8;
}

.feature-link {
  display:inline-flex;
  gap:7px;
  align-items:center;
  color:var(--green2);
  font-size:12px;
  font-weight:800;
  margin-top:17px;
}

.how-section {
  background:var(--navy);
  color:#fff;
  position:relative;
  overflow:hidden;
}

.how-section:before {
  content:"";
  position:absolute;
  width:420px;
  height:420px;
  border-radius:50%;
  background:rgba(16,185,129,.09);
  top:-200px;
  right:-100px;
}

.how-section .section-heading h2 {
  color:#fff;
}

.how-section .section-heading p {
  color:#bdc9dd;
}

.how-section .eyebrow {
  background:rgba(16,185,129,.12);
  border-color:rgba(110,231,183,.15);
  color:#6ee7b7;
}

.steps-grid {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
  position:relative;
}

.step-card {
  padding:25px 20px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:17px;
  background:rgba(255,255,255,.045);
}

.step-number {
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  border-radius:12px;
  background:rgba(16,185,129,.17);
  color:#6ee7b7;
  font-size:16px;
  font-weight:900;
  margin-bottom:20px;
}

.step-card h3 {
  font-size:16px;
  margin-bottom:10px;
}

.step-card p {
  color:#b9c6da;
  font-size:13px;
  line-height:1.8;
}

.builder-section {
  background:#fff;
}

.builder-grid {
  display:grid;
  grid-template-columns:.9fr 1.1fr;
  align-items:center;
  gap:45px;
}

.builder-copy h2 {
  color:var(--navy);
  font-size:clamp(28px,4vw,42px);
  line-height:1.2;
  letter-spacing:-1.4px;
  margin:17px 0;
}

.builder-copy p {
  color:var(--muted);
  font-size:14px;
  line-height:1.9;
}

.builder-list {
  list-style:none;
  display:grid;
  gap:14px;
  margin:23px 0;
}

.builder-list li {
  display:flex;
  align-items:flex-start;
  gap:11px;
  color:#46546c;
  font-size:13px;
}

.builder-list i {
  color:var(--green2);
  margin-top:4px;
}

.editor-mock {
  padding:17px;
  border:1px solid var(--border);
  border-radius:21px;
  box-shadow:var(--shadow);
  background:#fff;
}

.editor-top {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:3px 2px 15px;
  border-bottom:1px solid var(--border);
}

.editor-top strong {
  color:var(--navy);
  font-size:13px;
}

.editor-top span {
  color:var(--muted);
  font-size:11px;
}

.editor-workspace {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding-top:14px;
}

.editor-pane {
  min-width:0;
  border:1px solid var(--border);
  border-radius:13px;
  overflow:hidden;
}

.pane-title {
  padding:10px 12px;
  color:#536078;
  background:#f8fafc;
  border-bottom:1px solid var(--border);
  font-size:11px;
  font-weight:800;
}

.code-lines {
  padding:15px 12px;
  min-height:200px;
  background:#0f1b37;
  color:#b9f4dc;
  font-family:monospace;
  font-size:11px;
  line-height:2;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.preview-demo {
  padding:15px;
  min-height:200px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:#f8fafc;
}

.preview-demo-inner i {
  font-size:30px;
  color:var(--green2);
  margin-bottom:12px;
}

.preview-demo-inner h3 {
  color:var(--navy);
  font-size:16px;
  margin-bottom:6px;
}

.preview-demo-inner p {
  color:var(--muted);
  font-size:11px;
}

.pricing-section {
  background:var(--bg);
}

.pricing-grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  align-items:stretch;
}

.price-card {
  position:relative;
  padding:30px 26px;
  border:1px solid var(--border);
  border-radius:20px;
  background:#fff;
}

.price-card.popular {
  border:2px solid var(--green);
  box-shadow:0 15px 45px rgba(16,185,129,.12);
}

.popular-label {
  position:absolute;
  top:-14px;
  left:50%;
  transform:translateX(-50%);
  background:var(--green2);
  color:#fff;
  border-radius:20px;
  padding:5px 13px;
  white-space:nowrap;
  font-size:10px;
  font-weight:850;
}

.price-card h3 {
  color:var(--navy);
  font-size:19px;
}

.price-card .price-desc {
  color:var(--muted);
  font-size:12px;
  margin:8px 0 20px;
}

.price-value {
  font-size:34px;
  font-weight:900;
  letter-spacing:-1.2px;
  color:var(--navy);
}

.price-value small {
  font-size:12px;
  font-weight:600;
  letter-spacing:0;
  color:var(--muted);
}

.price-card .btn {
  width:100%;
  margin:19px 0;
}

.price-features {
  list-style:none;
  display:grid;
  gap:12px;
  margin-top:12px;
}

.price-features li {
  display:flex;
  gap:9px;
  color:#536078;
  font-size:12px;
}

.price-features i {
  color:var(--green2);
  margin-top:4px;
}

.security-section {
  background:#fff;
}

.security-grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.security-card {
  display:flex;
  align-items:flex-start;
  gap:15px;
  padding:23px;
  border:1px solid var(--border);
  border-radius:17px;
  background:#fff;
}

.security-card > i {
  display:grid;
  place-items:center;
  flex-shrink:0;
  width:44px;
  height:44px;
  border-radius:13px;
  color:var(--green2);
  background:#e9fbf3;
  font-size:18px;
}

.security-card h3 {
  color:var(--navy);
  font-size:14px;
  margin-bottom:7px;
}

.security-card p {
  color:var(--muted);
  font-size:12px;
  line-height:1.8;
}
