<script>
/* =========================================================
   LucasNode Frontend — inaunganishwa na lucasnode-backend
   Backend: https://lucasnode-backend.lucasherbalclinic.workers.dev
========================================================= */
const API_BASE = "https://lucasnode-backend.lucasherbalclinic.workers.dev";
const LS_TOKEN = "lucasnode_access_token";
const LS_REFRESH = "lucasnode_refresh_token";
const LS_USER = "lucasnode_user";

let authMode = "login";
const state = { user: null, ghPath: "", ghOwner: "", ghRepo: "", ghBranch: "main" };

/* ---------- helpers ---------- */
function $(id){ return document.getElementById(id); }
function toast(msg, kind){
  const t = $("toast");
  t.textContent = msg;
  t.className = "toast show" + (kind === "ok" ? " ok" : kind === "err" ? " err" : "");
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>{ t.className = "toast"; }, 3200);
}
function getToken(){ return localStorage.getItem(LS_TOKEN); }
function getRefreshToken(){ return localStorage.getItem(LS_REFRESH); }
function saveSession(session, user){
  if(session){
    if(session.access_token) localStorage.setItem(LS_TOKEN, session.access_token);
    if(session.refresh_token) localStorage.setItem(LS_REFRESH, session.refresh_token);
  }
  if(user){ state.user = user; localStorage.setItem(LS_USER, JSON.stringify(user)); updateAvatar(); }
}
function clearSession(){
  localStorage.removeItem(LS_TOKEN);
  localStorage.removeItem(LS_REFRESH);
  localStorage.removeItem(LS_USER);
  state.user = null;
  updateAvatar();
}
function isLoggedIn(){ return !!getToken(); }
function updateAvatar(){
  const a = $("avatarBtn");
  if(state.user && state.user.email){ a.textContent = (state.user.email[0]||"L").toUpperCase(); }
  else { a.textContent = "L"; }
}

/* ---------- API client with auto-refresh ---------- */
async function apiRequest(method, path, body, retry=true){
  const headers = { "Content-Type": "application/json" };
  const token = getToken();
  if(token) headers["Authorization"] = "Bearer " + token;
  try{
    const res = await fetch(API_BASE + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
    const data = await res.json().catch(()=>({ success:false, error:"Jibu si JSON." }));
    if(res.status === 401 && retry && getRefreshToken()){
      const refreshed = await refreshSession();
      if(refreshed) return apiRequest(method, path, body, false);
    }
    return { ok: res.ok, status: res.status, data };
  }catch(e){
    return { ok:false, status:0, data:{ success:false, error:"Imeshindikana kuunganisha na backend." } };
  }
}
async function refreshSession(){
  const r = await fetch(API_BASE + "/api/idhini/upya", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ refresh_token: getRefreshToken() })
  });
  const d = await r.json().catch(()=>null);
  if(r.ok && d && d.success && d.session){ saveSession(d.session, d.user); return true; }
  clearSession(); showAuthGate(); return false;
}

/* ---------- auth ---------- */
function showAuthGate(){ $("authGate").style.display = "flex"; }
function hideAuthGate(){ $("authGate").style.display = "none"; }
function setAuthTab(mode){
  authMode = mode;
  $("tabLogin").classList.toggle("active", mode==="login");
  $("tabRegister").classList.toggle("active", mode==="register");
  $("nameField").style.display = mode==="register" ? "grid" : "none";
  $("authSubmit").textContent = mode==="login" ? "Kuingia" : "Sajili";
}
async function submitAuth(e){
  e.preventDefault();
  const email = $("authEmail").value.trim().toLowerCase();
  const password = $("authPassword").value;
  if(authMode === "register"){
    const display_name = $("authName").value.trim();
    const r = await fetch(API_BASE+"/api/idhini/jisajili", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ email, password, display_name })
    });
    const d = await r.json().catch(()=>null);
    if(r.ok && d && d.success){
      if(d.session){ saveSession(d.session, d.user); hideAuthGate(); toast("Akaunti imetengenezwa. Karibu!","ok"); initApp(); }
      else { toast("Akaunti imetengenezwa. Angalia barua pepe kuthibitisha, kisha ingia.","ok"); setAuthTab("login"); }
    } else { toast(d?.error || "Usajili umeshindikana.","err"); }
  } else {
    const r = await fetch(API_BASE+"/api/idhini/kuingia", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ email, password })
    });
    const d = await r.json().catch(()=>null);
    if(r.ok && d && d.success && d.session){ saveSession(d.session, d.user); hideAuthGate(); toast("Karibu, "+(d.user?.email||"")+"!","ok"); initApp(); }
    else { toast(d?.error || "Barua pepe au nenosiri si sahihi.","err"); }
  }
}
async function logout(){
  if(!isLoggedIn()){ clearSession(); showAuthGate(); return; }
  await apiRequest("POST", "/api/idhini/toka", {}, false);
  clearSession(); showAuthGate(); toast("Umetoka kwenye akaunti.","ok");
}

/* ---------- navigation ---------- */
function showPage(name){
  if(!isLoggedIn()){ showAuthGate(); return; }
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  const el = $("page-"+name);
  if(el) el.classList.add("active");
  document.querySelectorAll(".bottom-item").forEach(b=>b.classList.toggle("active", b.dataset.page===name));
  closeDrawer();
  window.scrollTo(0,0);
  loadPageData(name);
}
function loadPageData(name){
  if(name==="home"||name==="projects") loadProjects();
  if(name==="domains") loadDomains();
  if(name==="hosting") loadTovuti();
  if(name==="deploy") loadDeployProjects();
  if(name==="monitoring") checkBackend();
  if(name==="settings") loadProfile();
}
function openDrawer(){ if(!isLoggedIn()){ showAuthGate(); return; } $("drawerOverlay").classList.add("show"); }
function closeDrawer(){ $("drawerOverlay").classList.remove("show"); }

/* ---------- modals ---------- */
function openModal(id){ if(!isLoggedIn()){ showAuthGate(); return; } $(id).classList.add("show"); }
function closeModal(id){ $(id).classList.remove("show"); }
function openCreateProject(){ openModal("modalProject"); }
function openDomainModal(){ openModal("modalDomain"); }
function openTovutiModal(){ openModal("modalTovuti"); }
function openSupportModal(){ openModal("modalSupport"); }
function openGithubModal(){ $("modalGithub").classList.add("show"); } // inapatikana bila login (GitHub API ni ya umma)

/* ---------- projects ---------- */
async function loadProjects(){
  const r = await apiRequest("GET", "/api/v1/projects");
  const list = (r.ok && r.data && r.data.data) ? r.data.data : [];
  renderProjects(list);
  updateStats();
}
function renderProjects(list){
  const home = $("homeProjects"), homeEmpty = $("homeEmpty");
  const pl = $("projectsList"), plEmpty = $("projectsEmpty");
  const fill = (container, emptyEl) => {
    if(!list.length){ container.style.display="none"; emptyEl.style.display="block"; container.innerHTML=""; return; }
    container.style.display="grid"; emptyEl.style.display="none";
    container.innerHTML = list.map(p=>projectCard(p)).join("");
  };
  fill(home, homeEmpty); fill(pl, plEmpty);
}
function projectCard(p){
  const repo = p.repository_url ? `<div class="project-meta">🔗 ${escapeHtml(p.repository_url)}${p.repository_branch?(" · "+escapeHtml(p.repository_branch)):""}</div>` : "";
  const meta = `<div class="project-meta">${escapeHtml(p.slug||p.name||"")} ${p.framework?("· "+escapeHtml(p.framework)):""}</div>`;
  return `<div class="project-card">
    <div class="project-main">
      <div class="project-icon">📁</div>
      <div><div class="project-name">${escapeHtml(p.name||"")}</div>${meta}${repo}</div>
    </div>
    <button class="del-btn" onclick="deleteProject('${p.id}')">🗑</button>
  </div>`;
}
async function createProject(e){
  e.preventDefault();
  const body = {
    name: $("projName").value.trim(),
    slug: $("projSlug").value.trim() || undefined,
    description: $("projDesc").value.trim() || undefined,
    framework: $("projFramework").value.trim() || undefined,
    repository_url: $("projRepo").value.trim() || undefined,
    repository_branch: $("projBranch").value.trim() || undefined
  };
  if(!body.name){ toast("Jina la project linahitajika.","err"); return; }
  const r = await apiRequest("POST", "/api/v1/projects", body);
  if(r.ok && r.data && r.data.success){ toast("Project imeundwa!","ok"); closeModal("modalProject"); e.target.reset(); loadProjects(); }
  else toast(r.data?.error || "Imeshindikana kuunda project.","err");
}
async function deleteProject(id){
  if(!confirm("Futa project hii?")) return;
  const r = await apiRequest("DELETE", "/api/v1/projects/"+id);
  if(r.ok) toast("Project imefutwa.","ok"); else toast(r.data?.error||"Imeshindikana kufuta.","err");
  loadProjects();
}

/* ---------- domains ---------- */
async function loadDomains(){
  const r = await apiRequest("GET", "/api/v1/domains");
  const list = (r.ok && r.data && r.data.data) ? r.data.data : [];
  const el = $("domainsList"), empty = $("domainsEmpty");
  if(!list.length){ el.style.display="none"; empty.style.display="block"; el.innerHTML=""; }
  else{ el.style.display="grid"; empty.style.display="none";
    el.innerHTML = list.map(d=>`<div class="project-card"><div class="project-main"><div class="project-icon">🌐</div><div><div class="project-name">${escapeHtml(d.domain||d.name||"")}</div><div class="project-meta">${escapeHtml(d.status||"connected")}</div></div></div><button class="del-btn" onclick="toast('Domain inasimamiwa na backend.','ok')">⚙</button></div>`).join("");
  }
  updateStats();
}
async function searchDomain(){
  const domain = ($("domainSearchInput").value||"").trim().toLowerCase();
  if(!domain){ toast("Weka domain.","err"); return; }
  $("domainSearchResult").textContent = "Inatafuta...";
  const r = await apiRequest("GET", "/api/domains/check?domain="+encodeURIComponent(domain));
  if(r.ok && r.data && r.data.success){ $("domainSearchResult").innerHTML = r.data.registered ? `✅ <b>${escapeHtml(domain)}</b> imekwisha sajiliwa (${r.data.source}).` : `🟢 <b>${escapeHtml(domain)}</b> inapatikana!`; }
  else $("domainSearchResult").textContent = r.data?.error || "Imeshindikana.";
}
async function checkDomainInModal(){
  const domain = ($("domainInput").value||"").trim().toLowerCase();
  if(!domain){ toast("Weka domain.","err"); return; }
  $("domainCheckResult").textContent = "Inatafuta...";
  const r = await apiRequest("GET", "/api/domains/check?domain="+encodeURIComponent(domain));
  if(r.ok && r.data && r.data.success){ $("domainCheckResult").innerHTML = r.data.registered ? `✅ Imekwisha sajiliwa (${r.data.source}).` : `🟢 Inapatikana!`; }
  else $("domainCheckResult").textContent = r.data?.error || "Imeshindikana.";
}
async function addDomain(e){
  e.preventDefault();
  const domain = ($("domainInput").value||"").trim().toLowerCase();
  if(!domain){ toast("Weka domain.","err"); return; }
  const r = await apiRequest("POST", "/api/v1/domains", { domain });
  if(r.ok && r.data && r.data.success){ toast("Domain imehifadhiwa!","ok"); closeModal("modalDomain"); e.target.reset(); loadDomains(); }
  else toast(r.data?.error || "Imeshindikana kuhifadhi domain.","err");
}

/* ---------- tovuti (hosting) ---------- */
async function loadTovuti(){
  const r = await apiRequest("GET", "/api/tovuti");
  const list = (r.ok && r.data && r.data.data) ? r.data.data : [];
  const el = $("tovutiList"), empty = $("tovutiEmpty");
  if(!list.length){ el.style.display="none"; empty.style.display="block"; el.innerHTML=""; }
  else{ el.style.display="grid"; empty.style.display="none";
    el.innerHTML = list.map(s=>`<div class="project-card"><div class="project-main"><div class="project-icon">🌍</div><div><div class="project-name">${escapeHtml(s.name||"")}</div><div class="project-meta">/${escapeHtml(s.slug||"")} · ${fmtDate(s.created_at)}</div></div></div><button class="btn btn-secondary" onclick="toast('Tovuti imehifadhiwa kwenye backend.','ok')">Angalia</button></div>`).join("");
  }
  updateStats();
}
async function createTovuti(e){
  e.preventDefault();
  const body = { name:$("tovutiName").value.trim(), slug:$("tovutiSlug").value.trim(), html:$("tovutiHtml").value };
  if(!body.name||!body.slug||!body.html){ toast("Jaza sehemu zote.","err"); return; }
  const r = await apiRequest("POST", "/api/tovuti", body);
  if(r.ok && r.data && r.data.success){ toast("Tovuti imehifadhiwa!","ok"); closeModal("modalTovuti"); e.target.reset(); loadTovuti(); }
  else toast(r.data?.error || "Imeshindikana kuhifadhi tovuti.","err");
}

/* ---------- deployments ---------- */
async function loadDeployProjects(){
  const r = await apiRequest("GET", "/api/v1/projects");
  const list = (r.ok && r.data && r.data.data) ? r.data.data : [];
  const sel = $("deployProject");
  sel.innerHTML = '<option value="">Chagua project</option>' + list.map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join("");
  loadDeployHistory();
}
async function loadDeployHistory(){
  const r = await apiRequest("GET", "/api/v1/deployments");
  const list = (r.ok && r.data && r.data.data) ? r.data.data : [];
  const el = $("deployHistoryList"), empty = $("deployHistoryEmpty");
  if(!list.length){ el.style.display="none"; empty.style.display="block"; el.innerHTML=""; }
  else{ el.style.display="grid"; empty.style.display="none";
    el.innerHTML = list.map(d=>`<div class="project-card"><div class="project-main"><div class="project-icon">🚀</div><div><div class="project-name">${escapeHtml(d.project_id||d.id||"Deployment")}</div><div class="project-meta">${escapeHtml(d.status||"")}</div></div></div></div>`).join("");
  }
  updateStats();
}
async function startDeployment(e){
  e.preventDefault();
  const pid = $("deployProject").value;
  if(!pid){ toast("Chagua project kwanza.","err"); return; }
  toast("Deployment imeombwa — backend inasimamia build na inspect.","ok");
  setTimeout(loadDeployHistory, 1500);
}

/* ---------- monitoring ---------- */
async function checkBackend(){
  const el = $("healthResult");
  if(el) el.textContent = "Inakagua...";
  const r = await apiRequest("GET", "/api/afya", null, false);
  if(r.ok && r.data && r.data.success){ if(el) el.innerHTML = '✅ <b>Hai</b> — LucasNode API inafanya kazi.'; toast("Backend inafanya kazi!","ok"); }
  else { if(el) el.textContent = r.data?.error || "Backend haipatikani."; toast("Backend haipatikani.","err"); }
}

/* ---------- profile ---------- */
async function loadProfile(){
  if(!isLoggedIn()) return;
  const r = await apiRequest("GET", "/api/v1/me");
  if(r.ok && r.data && r.data.success){
    const u = r.data.user||{}, p = r.data.profile||{};
    $("profileInfo").innerHTML = `📧 ${escapeHtml(u.email||"-")}<br>👤 ${escapeHtml(p.full_name||"-")}<br>📱 ${escapeHtml(p.phone||"-")}<br>🌍 ${escapeHtml(p.country||"-")}`;
  } else { $("profileInfo").textContent = r.data?.error || "Imeshindikana kusoma wasifu."; }
}

/* ---------- support tickets (local) ---------- */
async function createTicket(e){
  e.preventDefault();
  const subject = $("ticketSubject").value.trim(), message = $("ticketMessage").value.trim();
  if(!subject||!message){ toast("Jaza sehemu zote.","err"); return; }
  const tickets = JSON.parse(localStorage.getItem("lucasnode_tickets")||"[]");
  tickets.unshift({ subject, message, created_at: new Date().toISOString() });
  localStorage.setItem("lucasnode_tickets", JSON.stringify(tickets));
  toast("Ticket imetumwa!","ok"); closeModal("modalSupport"); e.target.reset(); renderTickets();
}
function renderTickets(){
  const tickets = JSON.parse(localStorage.getItem("lucasnode_tickets")||"[]");
  const el = $("ticketsList");
  if(!tickets.length){ el.className="empty"; el.innerHTML='<div class="empty-icon">🎫</div><h3>Hakuna support ticket</h3><p>Tickets zako zitaonekana hapa.</p>'; return; }
  el.className="project-list"; el.style.display="grid";
  el.innerHTML = tickets.map(t=>`<div class="project-card"><div class="project-main"><div class="project-icon">🎫</div><div><div class="project-name">${escapeHtml(t.subject)}</div><div class="project-meta">${fmtDate(t.created_at)}</div></div></div></div>`).join("");
}

/* ---------- GitHub downloader ---------- */
async function browseGithub(e){
  e.preventDefault();
  state.ghOwner = $("ghOwner").value.trim();
  state.ghRepo = $("ghRepo").value.trim();
  state.ghBranch = $("ghBranch").value.trim() || "main";
  state.ghPath = "";
  await fetchGithubDir("");
}
async function fetchGithubDir(path){
  state.ghPath = path;
  const token = $("ghToken").value.trim();
  const url = `https://api.github.com/repos/${encodeURIComponent(state.ghOwner)}/${encodeURIComponent(state.ghRepo)}/contents/${path}?ref=${encodeURIComponent(state.ghBranch)}`;
  const headers = { "Accept":"application/vnd.github+json" };
  if(token) headers["Authorization"] = "Bearer " + token;
  $("ghStatus").textContent = "Inasoma...";
  try{
    const res = await fetch(url, { headers });
    if(res.status === 404){ $("ghStatus").textContent = "Faili au saraka haipatikani (404)."; return; }
    if(res.status === 403){ $("ghStatus").textContent = "Upatikanaji umekataliwa (403). Kwa repo binafsi weka token sahihi."; return; }
    if(!res.ok){ $("ghStatus").textContent = "Hitilafu: "+res.status; return; }
    const items = await res.json();
    const arr = Array.isArray(items) ? items : [items];
    arr.sort((a,b)=> (a.type===b.type)? a.name.localeCompare(b.name) : (a.type==="dir"?-1:1));
    renderGhBreadcrumb();
    const tree = $("ghTree"); tree.style.display="block";
    tree.innerHTML = (path ? `<div class="gh-row" onclick="fetchGithubDir('${parentPath(path)}')">📁 <span class="gh-name">.. (nyuma)</span></div>` : "") +
      arr.map(it=> ghRow(it)).join("");
    $("ghStatus").textContent = `${arr.length} kipengee.`;
  }catch(err){ $("ghStatus").textContent = "Imeshindikana kuunganisha na GitHub."; }
}
function ghRow(it){
  const isDir = it.type === "dir";
  const icon = isDir ? "📁" : "📄";
  const click = isDir ? `fetchGithubDir('${it.path}')` : `downloadGithubFile('${it.path}','${it.download_url||""}')`;
  const size = isDir ? "" : `<span class="gh-size">${fmtSize(it.size)}</span>`;
  return `<div class="gh-row" onclick="${click}">${icon} <span class="gh-name">${escapeHtml(it.name)}</span>${size}</div>`;
}
function renderGhBreadcrumb(){
  const bc = $("ghBreadcrumb"); bc.style.display="block";
  const parts = state.ghPath.split("/").filter(Boolean);
  let html = `<span style="cursor:pointer;color:#93c5fd" onclick="fetchGithubDir('')">${escapeHtml(state.ghOwner)}/${escapeHtml(state.ghRepo)}</span> @ ${escapeHtml(state.ghBranch)}`;
  let acc = "";
  for(const p of parts){ acc = acc ? acc+"/"+p : p; html += ` / <span style="cursor:pointer;color:#93c5fd" onclick="fetchGithubDir('${acc}')">${escapeHtml(p)}</span>`; }
  bc.innerHTML = html;
}
async function downloadGithubFile(path, downloadUrl){
  const token = $("ghToken").value.trim();
  const rawUrl = downloadUrl || `https://raw.githubusercontent.com/${encodeURIComponent(state.ghOwner)}/${encodeURIComponent(state.ghRepo)}/${encodeURIComponent(state.ghBranch)}/${path}`;
  $("ghStatus").textContent = "Inapakua: "+path;
  try{
    const headers = {};
    if(token) headers["Authorization"] = "Bearer " + token;
    const res = await fetch(rawUrl, { headers });
    if(!res.ok){ $("ghStatus").textContent = "Imeshindikana kupakua: "+res.status; return; }
    const blob = await res.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = path.split("/").pop();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    $("ghStatus").textContent = "✅ Imepakuliwa: "+path;
    toast("File imepakuliwa!","ok");
  }catch(err){ $("ghStatus").textContent = "Imeshindikana kupakua."; }
}
function parentPath(p){ const i=p.lastIndexOf("/"); return i===-1?"":p.slice(0,i); }

/* ---------- utils ---------- */
function escapeHtml(s){ return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(s){ try{ return new Date(s).toLocaleString("sw"); }catch{ return s||""; } }
function fmtSize(b){ if(b==null) return ""; if(b<1024) return b+" B"; if(b<1048576) return (b/1024).toFixed(1)+" KB"; return (b/1048576).toFixed(1)+" MB"; }
async function updateStats(){
  const [p, d, dep] = await Promise.all([
    apiRequest("GET","/api/v1/projects"),
    apiRequest("GET","/api/v1/domains"),
    apiRequest("GET","/api/v1/deployments")
  ]);
  $("statProjects").textContent = (p.ok&&p.data?.data)? p.data.data.length : 0;
  $("statDomains").textContent = (d.ok&&d.data?.data)? d.data.data.length : 0;
  $("statDeployments").textContent = (dep.ok&&dep.data?.data)? dep.data.data.length : 0;
  const t = await apiRequest("GET","/api/tovuti");
  $("statLive").textContent = (t.ok&&t.data?.data)? t.data.data.length : 0;
}

/* ---------- init ---------- */
async function initApp(){
  hideAuthGate();
  updateAvatar();
  renderTickets();
  showPage("home");
}
async function bootstrap(){
  const token = getToken();
  if(!token){ showAuthGate(); return; }
  const r = await apiRequest("GET", "/api/idhini/mimi", null, false);
  if(r.ok && r.data && r.data.success && r.data.user){ state.user = r.data.user; updateAvatar(); initApp(); }
  else {
    const refreshed = await refreshSession();
    if(refreshed){ state.user = JSON.parse(localStorage.getItem(LS_USER)||"null"); updateAvatar(); initApp(); }
    else showAuthGate();
  }
}
bootstrap();
document.querySelectorAll(".modal-wrap").forEach(m=> m.addEventListener("click", e=>{ if(e.target===m) m.classList.remove("show"); }));
</script>
</body>

<script>
/* =========================================================
   LucasNode Frontend — inaunganishwa na lucasnode-backend
   Backend: https://lucasnode-backend.lucasherbalclinic.workers.dev
========================================================= */
const API_BASE = "https://lucasnode-backend.lucasherbalclinic.workers.dev";
const LS_TOKEN = "lucasnode_access_token";
const LS_REFRESH = "lucasnode_refresh_token";
const LS_USER = "lucasnode_user";

let authMode = "login";
const state = { user: null, ghPath: "", ghOwner: "", ghRepo: "", ghBranch: "main" };

/* ---------- helpers ---------- */
function $(id){ return document.getElementById(id); }
function toast(msg, kind){
  const t = $("toast");
  t.textContent = msg;
  t.className = "toast show" + (kind === "ok" ? " ok" : kind === "err" ? " err" : "");
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>{ t.className = "toast"; }, 3200);
}
function getToken(){ return localStorage.getItem(LS_TOKEN); }
function getRefreshToken(){ return localStorage.getItem(LS_REFRESH); }
function saveSession(session, user){
  if(session){
    if(session.access_token) localStorage.setItem(LS_TOKEN, session.access_token);
    if(session.refresh_token) localStorage.setItem(LS_REFRESH, session.refresh_token);
  }
  if(user){ state.user = user; localStorage.setItem(LS_USER, JSON.stringify(user)); updateAvatar(); }
}
function clearSession(){
  localStorage.removeItem(LS_TOKEN);
  localStorage.removeItem(LS_REFRESH);
  localStorage.removeItem(LS_USER);
  state.user = null;
  updateAvatar();
}
function isLoggedIn(){ return !!getToken(); }
function updateAvatar(){
  const a = $("avatarBtn");
  if(state.user && state.user.email){ a.textContent = (state.user.email[0]||"L").toUpperCase(); }
  else { a.textContent = "L"; }
}

/* ---------- API client with auto-refresh ---------- */
async function apiRequest(method, path, body, retry=true){
  const headers = { "Content-Type": "application/json" };
  const token = getToken();
  if(token) headers["Authorization"] = "Bearer " + token;
  try{
    const res = await fetch(API_BASE + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
    const data = await res.json().catch(()=>({ success:false, error:"Jibu si JSON." }));
    if(res.status === 401 && retry && getRefreshToken()){
      const refreshed = await refreshSession();
      if(refreshed) return apiRequest(method, path, body, false);
    }
    return { ok: res.ok, status: res.status, data };
  }catch(e){
    return { ok:false, status:0, data:{ success:false, error:"Imeshindikana kuunganisha na backend." } };
  }
}
async function refreshSession(){
  const r = await fetch(API_BASE + "/api/idhini/upya", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ refresh_token: getRefreshToken() })
  });
  const d = await r.json().catch(()=>null);
  if(r.ok && d && d.success && d.session){ saveSession(d.session, d.user); return true; }
  clearSession(); showAuthGate(); return false;
}

/* ---------- auth ---------- */
function showAuthGate(){ $("authGate").style.display = "flex"; }
function hideAuthGate(){ $("authGate").style.display = "none"; }
function setAuthTab(mode){
  authMode = mode;
  $("tabLogin").classList.toggle("active", mode==="login");
  $("tabRegister").classList.toggle("active", mode==="register");
  $("nameField").style.display = mode==="register" ? "grid" : "none";
  $("authSubmit").textContent = mode==="login" ? "Kuingia" : "Sajili";
}
async function submitAuth(e){
  e.preventDefault();
  const email = $("authEmail").value.trim().toLowerCase();
  const password = $("authPassword").value;
  if(authMode === "register"){
    const display_name = $("authName").value.trim();
    const r = await fetch(API_BASE+"/api/idhini/jisajili", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ email, password, display_name })
    });
    const d = await r.json().catch(()=>null);
    if(r.ok && d && d.success){
      if(d.session){ saveSession(d.session, d.user); hideAuthGate(); toast("Akaunti imetengenezwa. Karibu!","ok"); initApp(); }
      else { toast("Akaunti imetengenezwa. Angalia barua pepe kuthibitisha, kisha ingia.","ok"); setAuthTab("login"); }
    } else { toast(d?.error || "Usajili umeshindikana.","err"); }
  } else {
    const r = await fetch(API_BASE+"/api/idhini/kuingia", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ email, password })
    });
    const d = await r.json().catch(()=>null);
    if(r.ok && d && d.success && d.session){ saveSession(d.session, d.user); hideAuthGate(); toast("Karibu, "+(d.user?.email||"")+"!","ok"); initApp(); }
    else { toast(d?.error || "Barua pepe au nenosiri si sahihi.","err"); }
  }
}
async function logout(){
  if(!isLoggedIn()){ clearSession(); showAuthGate(); return; }
  await apiRequest("POST", "/api/idhini/toka", {}, false);
  clearSession(); showAuthGate(); toast("Umetoka kwenye akaunti.","ok");
}

/* ---------- projects ---------- */
async function loadProjects(){
  const r = await apiRequest("GET", "/api/v1/projects");
  const list = (r.ok && r.data && r.data.data) ? r.data.data : [];
  renderProjects(list);
  updateStats();
}
function renderProjects(list){
  const home = $("homeProjects"), homeEmpty = $("homeEmpty");
  const pl = $("projectsList"), plEmpty = $("projectsEmpty");
  const fill = (container, emptyEl) => {
    if(!list.length){ container.style.display="none"; emptyEl.style.display="block"; container.innerHTML=""; return; }
    container.style.display="grid"; emptyEl.style.display="none";
    container.innerHTML = list.map(p=>projectCard(p)).join("");
  };
  fill(home, homeEmpty); fill(pl, plEmpty);
}
function projectCard(p){
  const repo = p.repository_url ? `<div class="project-meta">🔗 ${escapeHtml(p.repository_url)}${p.repository_branch?(" · "+escapeHtml(p.repository_branch)):""}</div>` : "";
  const meta = `<div class="project-meta">${escapeHtml(p.slug||p.name||"")} ${p.framework?("· "+escapeHtml(p.framework)):""}</div>`;
  return `<div class="project-card">
    <div class="project-main">
      <div class="project-icon">📁</div>
      <div><div class="project-name">${escapeHtml(p.name||"")}</div>${meta}${repo}</div>
    </div>
    <button class="del-btn" onclick="deleteProject('${p.id}')">🗑</button>
  </div>`;
}

    framework: $("projFramework").value.trim() || undefined,

/* ---------- GitHub downloader ---------- */
async function browseGithub(e){
  e.preventDefault();
  state.ghOwner = $("ghOwner").value.trim();
  state.ghRepo = $("ghRepo").value.trim();
  state.ghBranch = $("ghBranch").value.trim() || "main";
  state.ghPath = "";
  await fetchGithubDir("");
}
async function fetchGithubDir(path){
  state.ghPath = path;
  const token = $("ghToken").value.trim();
  const url = `https://api.github.com/repos/${encodeURIComponent(state.ghOwner)}/${encodeURIComponent(state.ghRepo)}/contents/${path}?ref=${encodeURIComponent(state.ghBranch)}`;
  const headers = { "Accept":"application/vnd.github+json" };
  if(token) headers["Authorization"] = "Bearer " + token;
  $("ghStatus").textContent = "Inasoma...";
  try{
    const res = await fetch(url, { headers });
    if(res.status === 404){ $("ghStatus").textContent = "Faili au saraka haipatikani (404)."; return; }
    if(res.status === 403){ $("ghStatus").textContent = "Upatikanaji umekataliwa (403). Kwa repo binafsi weka token sahihi."; return; }
    if(!res.ok){ $("ghStatus").textContent = "Hitilafu: "+res.status; return; }
    const items = await res.json();
    const arr = Array.isArray(items) ? items : [items];
    arr.sort((a,b)=> (a.type===b.type)? a.name.localeCompare(b.name) : (a.type==="dir"?-1:1));
    renderGhBreadcrumb();
    const tree = $("ghTree"); tree.style.display="block";
    tree.innerHTML = (path ? `<div class="gh-row" onclick="fetchGithubDir('${parentPath(path)}')">📁 <span class="gh-name">.. (nyuma)</span></div>` : "") +
      arr.map(it=> ghRow(it)).join("");
    $("ghStatus").textContent = `${arr.length} kipengee.`;
  }catch(err){ $("ghStatus").textContent = "Imeshindikana kuunganisha na GitHub."; }
}
function ghRow(it){
  const isDir = it.type === "dir";
  const icon = isDir ? "📁" : "📄";
  const click = isDir ? `fetchGithubDir('${it.path}')` : `downloadGithubFile('${it.path}','${it.download_url||""}')`;
  const size = isDir ? "" : `<span class="gh-size">${fmtSize(it.size)}</span>`;
  return `<div class="gh-row" onclick="${click}">${icon} <span class="gh-name">${escapeHtml(it.name)}</span>${size}</div>`;
}
function renderGhBreadcrumb(){
  const bc = $("ghBreadcrumb"); bc.style.display="block";
  const parts = state.ghPath.split("/").filter(Boolean);
  let html = `<span style="cursor:pointer;color:#93c5fd" onclick="fetchGithubDir('')">${escapeHtml(state.ghOwner)}/${escapeHtml(state.ghRepo)}</span> @ ${escapeHtml(state.ghBranch)}`;
  let acc = "";
  for(const p of parts){ acc = acc ? acc+"/"+p : p; html += ` / <span style="cursor:pointer;color:#93c5fd" onclick="fetchGithubDir('${acc}')">${escapeHtml(p)}</span>`; }
  bc.innerHTML = html;
}
async function downloadGithubFile(path, downloadUrl){
  const token = $("ghToken").value.trim();
  const rawUrl = downloadUrl || `https://raw.githubusercontent.com/${encodeURIComponent(state.ghOwner)}/${encodeURIComponent(state.ghRepo)}/${encodeURIComponent(state.ghBranch)}/${path}`;
  $("ghStatus").textContent = "Inapakua: "+path;
  try{
    const headers = {};
    if(token) headers["Authorization"] = "Bearer " + token;
    const res = await fetch(rawUrl, { headers });
    if(!res.ok){ $("ghStatus").textContent = "Imeshindikana kupakua: "+res.status; return; }
    const blob = await res.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = path.split("/").pop();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    $("ghStatus").textContent = "✅ Imepakuliwa: "+path;
    toast("File imepakuliwa!","ok");
  }catch(err){ $("ghStatus").textContent = "Imeshindikana kupakua."; }
}
function parentPath(p){ const i=p.lastIndexOf("/"); return i===-1?"":p.slice(0,i); }

/* ---------- utils ---------- */
function escapeHtml(s){ return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(s){ try{ return new Date(s).toLocaleString("sw"); }catch{ return s||""; } }
function fmtSize(b){ if(b==null) return ""; if(b<1024) return b+" B"; if(b<1048576) return (b/1024).toFixed(1)+" KB"; return (b/1048576).toFixed(1)+" MB"; }
async function updateStats(){
  const [p, d, dep] = await Promise.all([
    apiRequest("GET","/api/v1/projects"),
    apiRequest("GET","/api/v1/domains"),
    apiRequest("GET","/api/v1/deployments")
  ]);
  $("statProjects").textContent = (p.ok&&p.data?.data)? p.data.data.length : 0;
  $("statDomains").textContent = (d.ok&&d.data?.data)? d.data.data.length : 0;
  $("statDeployments").textContent = (dep.ok&&dep.data?.data)? dep.data.data.length : 0;
  const t = await apiRequest("GET","/api/tovuti");
  $("statLive").textContent = (t.ok&&t.data?.data)? t.data.data.length : 0;
}

async function bootstrap(){
  const token = getToken();
  if(!token){ showAuthGate(); return; }
  const r = await apiRequest("GET", "/api/idhini/mimi", null, false);
  if(r.ok && r.data && r.data.success && r.data.user){ state.user = r.data.user; updateAvatar(); initApp(); }
  else {
    const refreshed = await refreshSession();
    if(refreshed){ state.user = JSON.parse(localStorage.getItem(LS_USER)||"null"); updateAvatar(); initApp(); }
    else showAuthGate();
  }
}
bootstrap();
